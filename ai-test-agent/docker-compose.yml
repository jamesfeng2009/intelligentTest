# AI 测试智能体平台 — 生产模式基础设施（PostgreSQL + MinIO）
# 用法：docker compose up -d
# 平台切换到生产存储：
#   export DATABASE_URL="postgresql+psycopg://ai_test:ai_test@localhost:5432/ai_test"
#   export MINIO_ENDPOINT="localhost:9000" MINIO_ACCESS_KEY=minioadmin MINIO_SECRET_KEY=minioadmin
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-test-pg
    environment:
      POSTGRES_USER: ai_test
      POSTGRES_PASSWORD: ai_test
      POSTGRES_DB: ai_test
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data

volumes:
  pg-data:
  minio-data:
