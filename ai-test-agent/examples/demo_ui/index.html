<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 测试智能体 · 电商演示站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1f2937; padding: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 640px; margin: 0 auto 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin-bottom: 16px; color: #0f766e; }
  h2 { font-size: 16px; margin-bottom: 12px; }
  .form-row { margin-bottom: 12px; }
  label { display: block; font-size: 14px; margin-bottom: 4px; color: #334155; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  button { background: #0f766e; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #115e59; }
  .hidden { display: none; }
  #welcome { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  #product-list { list-style: none; }
  #product-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
  #msg { font-size: 13px; margin-top: 10px; color: #334155; min-height: 18px; }
  .error { color: #dc2626; }
</style>
</head>
<body>
  <div class="card" id="login-card">
    <h1>AI 测试智能体 · 电商演示站</h1>
    <h2>登录</h2>
    <div class="form-row">
      <label for="username">用户名</label>
      <input id="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-row">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button id="login-btn">登录</button>
    <div id="msg"></div>
  </div>

  <div class="card hidden" id="app-card">
    <div id="welcome">欢迎，admin</div>
    <h2>商品管理</h2>
    <div class="form-row">
      <label for="product-name">商品名称</label>
      <input id="product-name" placeholder="请输入商品名称">
    </div>
    <div class="form-row">
      <label for="product-price">商品价格</label>
      <input id="product-price" placeholder="请输入价格">
    </div>
    <button id="add-btn">新增商品</button>
    <div id="msg2"></div>
    <h2 style="margin-top:16px;">商品列表</h2>
    <ul id="product-list">
      <li><span>示例商品</span><span>¥199.00</span></li>
    </ul>
  </div>

<script>
  const USERS = { admin: "123456" };
  const loginCard = document.getElementById("login-card");
  const appCard = document.getElementById("app-card");
  const msg = document.getElementById("msg");

  document.getElementById("login-btn").addEventListener("click", () => {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (!u || !p) { msg.textContent = "请输入用户名和密码"; msg.className = "error"; return; }
    if (USERS[u] !== p) { msg.textContent = "用户名或密码错误"; msg.className = "error"; return; }
    loginCard.classList.add("hidden");
    appCard.classList.remove("hidden");
    msg.textContent = "登录成功";
  });

  document.getElementById("add-btn").addEventListener("click", () => {
    const name = document.getElementById("product-name").value.trim();
    const price = document.getElementById("product-price").value.trim();
    const msg2 = document.getElementById("msg2");
    if (!name || !price) { msg2.textContent = "请填写商品名称和价格"; msg2.className = "error"; return; }
    const li = document.createElement("li");
    li.innerHTML = `<span>${name}</span><span>¥${Number(price).toFixed(2)}</span>`;
    document.getElementById("product-list").appendChild(li);
    msg2.textContent = "商品创建成功";
    msg2.className = "";
    document.getElementById("product-name").value = "";
    document.getElementById("product-price").value = "";
  });
</script>
</body>
</html>
